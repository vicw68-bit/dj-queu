<style>
* {

}

/* GLOBAL */
body {

/* TOP */
.top {
  margin-bottom: 20px;

}

/* TITLE (ne change pas) */
.title {.title-size: clamp(40px, 6vw, 70px) !important;
  color: #6ff4f0 !important;

  padding: 12px 30px !important;

  border: 3px solid #6ff4f0 !important; /* ✅ cadre forcé */

  display: inline-block !important;
  cursor: pointer;

.title:hover {
  transform: scale(1.08);
  box-shadow:
    0 0 25px rgba(0,240,255,1),

}

/* effet clic */
.title:active {
  transform: scale(0.92);
  box-shadow:
    0 0 10px rgba(0,240,255,0.6);
}


/* SUBTITLE FIX ✅ */
.subtitle {
  margin-top: 10px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 8px 22px;

  background: linear-gradient(135deg,#00f0ff,#bf00ff);
  color: white;

  border-radius: 50px;

  font-family: 'DM Sans', sans-serif;
  font-weight: 400;

  font-size: 14px;
  letter-spacing: 1px;

  text-transform: uppercase;

  box-shadow: 0 0 15px rgba(0,240,255,0.6);

  backdrop-filter: blur(6px);

  line-height: 1;
}


/* CENTER DISC */
.center-visual {
  flex:0.4;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 🔥 DISQUE SPIRALE */
.disc {
  width:440px;
  height:440px;
  border-radius:50%;
  position: relative;

  /* ✅ spirale + lignes propres */
  background:
    repeating-conic-gradient(
      rgba(255,255,255,0.08) 0deg,
      transparent 48deg
    ),
    repeating-radial-gradient(
      circle,
      #111 0px,
      #111 5px,
      #222 5px,
      #222 10px
    );

  /* ✅ glow DJ */
  box-shadow:
    0 0 25px rgba(0,240,255,0.5),
    0 0 80px rgba(255,0,200,0.4);

  animation: spin 24s linear infinite;
}


/* ✅ CENTRE DU VINYLE */
.disc::after {
  content:"";

  width:120px;
  height:120px;

  border-radius:50%;

  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);

  /* ✅ TON IMAGE */
  background: url("test1.jpg");
  background-size: cover;
  background-position: center;

  border: 4px solid #000;

  /* ✅ effet glow */
  box-shadow:
    0 0 10px rgba(0,240,255,0.5),
    0 0 20px rgba(255,0,200,0.4);
}


/* ✅ ANIMATION ROTATION */
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* BOTTOM */

.bottom {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
}

transform: translateY(-30px); /* ✅ remonte sans agrandir la page */
}


.who {
  margin-bottom:20px;
  letter-spacing:2px;
}

.buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
}

.btn {
  background:#d9d6d1;
  border-radius:40px;
  padding:16px 0;
  font-size:20px;
  border:none;
  cursor:pointer;

  transition: transform 0.15s ease, box-shadow 0.15s ease;

  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* ✅ SURVOL = petit agrandissement */
.btn:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

/* ✅ CLIC = effet appui */
.btn:active {
  transform: scale(0.95);
  box-shadow: 0 2px 5px rgba(0,0,0,0.4);
}

.buttons .btn:first-child {
  box-shadow: 0 0 15px rgba(0,240,255,0.6);
}

.buttons .btn:first-child:hover {
  box-shadow: 0 0 30px rgba(0,240,255,1);
}

.buttons .btn:nth-child(2) {
  box-shadow: 0 0 15px rgba(255,0,200,0.6);
}

.buttons .btn:nth-child(2):hover {
  box-shadow: 0 0 30px rgba(255,0,200,1);
}


.credit {
  margin-top: 15px;
  font-size: 13px;
  opacity: 0.6;
}



html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  width: 100%;
touch-action: manipulation;
}



/* APP */
.container {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;

  display: flex;
  flex-direction: column;
  gap: 10px;
}

.back {
  background:#fff;
  color:#000;
  font-weight:bold;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

input, select {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

.item {
  background: rgba(0,0,0,0.6);

  padding: 18px; /* ✅ plus grand */
  margin-top: 12px;

  border-radius: 12px;

  backdrop-filter: blur(8px);

  font-size: 18px; /* ✅ texte plus grand */

  transition: transform 0.2s;
}
``

.item strong {
  font-size: 20px; /* numéro + titre */
}

.item small {
  font-size: 14px;
  opacity: 0.8;
}
.item:hover {
  transform: scale(1.02);  /* ✅ léger zoom */
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap: 10px; /* ✅ espace propre */
}


.playing {
  border-left: 4px solid cyan;
  box-shadow: 0 0 15px rgba(0,240,255,0.6);
}



.delete {
  width: 40px;   /* ✅ plus gros */
  height: 40px;

  font-size: 18px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  cursor:pointer;
}
``


/* ✅ GLOBAL LOCK */
html, body {
  height: 100%;
  overflow: hidden;
  margin: 0;
}

/* ✅ BACKGROUND */
.background {
  height: 100vh;
  width: 100%;

margin: 0;
  overflow: hidden;

  background:
    radial-gradient(circle at 20% 20%, rgba(0,240,255,0.2), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(255,0,200,0.2), transparent 40%),
    linear-gradient(180deg, #2c00c7, #0d003a);

  background-size: 200% 200%;
  background-position: 0% 50%;
  animation: moveBg 8s ease-in-out infinite;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  padding: 15px;
  box-sizing: border-box;

overflow: hidden; /* ✅ empêche débordement interne */
}

/* ✅ ANIMATION FOND */
@keyframes moveBg {
  0% { background-position: 0% 50%; }
  25% { background-position: 50% 100%; }
  50% { background-position: 100% 50%; }
  75% { background-position: 50% 0%; }
  100% { background-position: 0% 50%; }
}

/* ✅ HOVER LISTE */
.delete:hover {
  background:#ff2d78;
  color:white;
}

.item:hover {
  transform: translateX(6px);
  transition:0.2s;
}

/* ✅ MOBILE FIX PERFECT */
@media screen and (max-width: 768px) {

  body {
    font-size: 14px;
  }

  /* ✅ CENTRAGE GLOBAL */
  .background {
    justify-content: center;
    align-items: center;
    padding: 15px;
  }

  /* ✅ CONTENU CENTRÉ */
  .top {
    text-align: center;
    width: 100%;
  }

  .bottom {
    width: 100%;
    max-width: 350px;
    transform: translateY(-15px);
  }

  /* ✅ TITRE */
  .title {
  font-size: clamp(40px, 6vw, 70px);
  color: #6ff4f0;

  padding: 10px 30px;

  border: 3px solid #6ff4f0; /* ✅ cadre */

  border-radius: 12px;

  display: inline-block; 
  cursor: pointer;

  /* ✅ glow texte */
  text-shadow:
    0 0 8px rgba(0,240,255,0.9),
    0 0 20px rgba(0,240,255,0.8);

  /* ✅ glow cadre */
  box-shadow:
    0 0 15px rgba(0,240,255,0.7),
    0 0 40px rgba(255,0,200,0.4);

  transition: all 0.2s ease;
}

.title:hover {
  transform: scale(1.1);

  box-shadow:
    0 0 25px rgba(0,240,255,1),
    0 0 60px rgba(255,0,200,0.6);
}

/* clic */
.title:active {
  transform: scale(0.9);
}


  /* ✅ SUBTITLE */
  .subtitle {
    font-size: 12px;
    padding: 6px 15px;
    margin-top: 8px;
  }

  /* ✅ DISQUE */
  .disc {
    width: 180px;
    height: 180px;
  }

  .disc::after {
    width: 60px;
    height: 60px;
  }

  /* ✅ ESPACES */
  .top {
    margin-bottom: 10px;
  }

  /* ✅ BOUTONS */
  .buttons {
    gap: 15px;
    width: 100%;
  }

  .btn {
    font-size: 14px;
    padding: 10px 0;
    width: 100%;
  }

  /* ✅ TEXTE */
  .who {
    font-size: 16px;
    margin-bottom: 10px;
  }
}


.container {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
}

.top,
.bottom {
  width: 100%;
  max-width: 500px; /* ✅ limite largeur mobile */
  margin: 0 auto;
}

.result {
  display:flex;
  align-items:center;
  gap:10px;

  background: rgba(0,0,0,0.6);
  margin-top:6px;
  padding:8px;
  border-radius:8px;

  cursor:pointer;
  transition:0.2s;
}

.result:hover {
  transform: scale(1.03);
}

body {

</style>

</head>

<body>

<!-- HOME -->
<div id="home" class="background">

  <div class="top">
    <h1 class="title" onclick="goChoice()">QUEUE IT</h1>
    <p class="subtitle">DROP YOUR TRACK 🎧</p>
  </div>

  <div class="center-visual">
    <div class="disc"></div>
  </div>


  <div class="credit">Made by : vico</div>
</div>
 </div>

<!-- PAGE 2 : CHOIX -->
<div id="choice" class="background" style="display:none;">

  <h2 class="who">WHO ARE YOU ?</h2>

  <div class="buttons">
    <button class="btn" onclick="askCode()">DJ</button>
    <button class="btn" onclick="goUser()">ASKER</button>
  </div>

</div>


<!-- APP -->

<div id="app" class="background" style="display:none;">


  <button class="back" onclick="location.reload()">⬅ Retour menu</button>

  <div id="requestSection">
    <h2>Ajouter une musique</h2>

    <input id="song" placeholder="Titre">
    <input id="name" placeholder="Artiste">
<div id="results"></div>

    <select id="platform">
      <option value="">Plateforme</option>
      <option>Spotify</option>
      <option>YouTube</option>
      <option>Deezer</option>
      <option>Apple Music</option>
      <option>SoundCloud</option>
    </select>

    <button onclick="add()">Envoyer</button>
  </div>

  <h2>File d'attente</h2>
  <div id="list"></div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAdyyVW-ZTn8O5RjGuq8JZeirY_kOlGxoQ",
  authDomain: "dj-queu.firebaseapp.com",
  databaseURL: "https://dj-queu-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dj-queu"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ref = db.ref("queue");

let queue = [];
let isDJ = false;

/* NAV */

function goUser(){
  isDJ = false;

  document.getElementById("choice").style.display = "none";
  document.getElementById("app").style.display = "flex";

  document.getElementById("requestSection").style.display = "block";
}

function goChoice(){
  document.getElementById("home").style.display = "none";
  document.getElementById("choice").style.display = "flex";
}

function askCode(){
  const code = prompt("Code DJ ?");
  if(code === "120916"){
    isDJ = true;

    document.getElementById("choice").style.display = "none";
    document.getElementById("app").style.display = "flex";

    document.getElementById("requestSection").style.display = "none";

    render(); // ✅ IMPORTANT
  }
}


const songInput = document.getElementById("song");
const resultsDiv = document.getElementById("results");

let timer;

songInput.addEventListener("input", () => {
  clearTimeout(timer);

  const query = songInput.value.trim();
  if(query.length < 2){
    resultsDiv.innerHTML = "";
    return;
  }

  timer = setTimeout(async () => {
    try {
      const res = await fetch(
        "https://api.deezer.com/search?q=" + query + "&output=jsonp"
      );
      const text = await res.text();
      const json = JSON.parse(text.replace(/^[^(]+\(|\);?$/g, ""));

      resultsDiv.innerHTML = "";

      json.data.slice(0,5).forEach(track => {

        const div = document.createElement("div");
        div.className = "result";

        div.innerHTML = `
          <img src="${track.album.cover_small}">
          <div>${track.artist.name} - ${track.title}</div>
        `;

        div.onclick = () => {
          songInput.value = track.artist.name + " - " + track.title;

          songInput.dataset.link = track.link;
          songInput.dataset.cover = track.album.cover_medium;

          resultsDiv.innerHTML = "";
        };

        resultsDiv.appendChild(div);

      });

    } catch(e){
      console.log(e);
    }
  }, 300);
});

/* ADD */

function add(){
  const song = document.getElementById("song").value.trim();
  const name = document.getElementById("name").value || "Anonyme";
  const platform = document.getElementById("platform").value;

  const link = songInput.dataset.link || "";
  const cover = songInput.dataset.cover || "";

  if(!song) return alert("Entre une musique");

  ref.push({
    song,
    name,
    platform,
    link,
    cover
  });

  document.getElementById("song").value = "";
  document.getElementById("name").value = "";

  delete songInput.dataset.link;
 delete songInput.dataset.cover;
}


/* REMOVE */
function remove(id){
  if(!isDJ) return;
  ref.child(id).remove();
}

/* LIVE */
ref.on("value", snap => {
  const data = snap.val();
  queue = data ? Object.entries(data).map(([id,val]) => ({id,...val})) : [];
  render();
});

/* DRAG */
let draggedIndex = null;

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  queue.forEach((item,i)=>{
    const div = document.createElement("div");
    div.className = "item " + (i===0 ? "playing" : "");
    div.draggable = isDJ;

    div.innerHTML = `
      <div class="row">
        <div>
          <strong>${i===0 ? "▶" : i+1}</strong> ${item.song}<br>
          <small>${item.name}</small>
        </div>
        ${
          isDJ
            ? `<button class="delete" onclick="remove('${item.id}')">✕</button>`
            : ""
        }
      </div>
    `;

    /* DRAG */
    if(isDJ){
      div.addEventListener("dragstart", () => draggedIndex = i);
      div.addEventListener("dragover", e => e.preventDefault());
      div.addEventListener("drop", ()=>{
        const moved = queue.splice(draggedIndex,1)[0];
        queue.splice(i,0,moved);

        const updated = {};
        queue.forEach(q => updated[q.id] = q);
        ref.set(updated);
      });
    }

    list.appendChild(div);
  });
}
``
</script>

</body>
