
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Queue</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
* {
  box-sizing: border-box;
}

/* GLOBAL */
body {
  margin:0;
  font-family:sans-serif;
  background:#0a0a12;
  color:#fff;
}

/* 🔥 HOME DESIGN */
.home {
  height:100vh;
  width:100%;

  background:
    radial-gradient(circle at 20% 20%, rgba(0,240,255,0.2), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(255,0,200,0.2), transparent 40%),
    linear-gradient(180deg, #2c00c7, #0d003a);

  background-size: 200% 200%;
  background-position: 0% 50%;

  animation: moveBg 8s ease-in-out infinite;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;

  padding:40px 20px;
  position:relative;
}


/* TOP */
.top {
  margin-bottom: 20px;

  display: flex;              /* ✅ important */
  flex-direction: column;
  align-items: center;        /* ✅ centre PAR RAPPORT AU TITRE */
}

/* TITLE (ne change pas) */
.title {
  font-size: clamp(40px, 6vw, 70px);
  color: #6ff4f0;

  padding: 8px 25px;

  border: 3px solid #6ff4f0;
  border-radius: 12px;

  display: inline-block;

  text-shadow:
    0 0 10px rgba(0,240,255,0.8),
    0 0 20px rgba(0,240,255,0.6),
    0 0 40px rgba(0,240,255,0.3);

  box-shadow:
    0 0 10px rgba(0,240,255,0.6),
    0 0 30px rgba(255,0,200,0.4);

  transition: 0.3s ease;
}

.title:hover {
  box-shadow:
    0 0 20px rgba(0,240,255,1),
    0 0 50px rgba(0,240,255,0.8);

  transform: scale(1.02);
}

/* SUBTITLE FIX ✅ */
.subtitle {
  margin-top: 10px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 8px 22px;

  background: linear-gradient(135deg,#00f0ff,#bf00ff);
  color: white;

  border-radius: 50px;

  font-family: 'DM Sans', sans-serif;
  font-weight: 400;

  font-size: 14px;
  letter-spacing: 1px;

  text-transform: uppercase;

  box-shadow: 0 0 15px rgba(0,240,255,0.6);

  backdrop-filter: blur(6px);

  line-height: 1;
}


/* CENTER DISC */
.center-visual {
  flex:0.4;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 🔥 DISQUE SPIRALE */
.disc {
  width:440px;
  height:440px;
  border-radius:50%;
  position: relative;

  /* ✅ spirale + lignes propres */
  background:
    repeating-conic-gradient(
      rgba(255,255,255,0.08) 0deg,
      transparent 48deg
    ),
    repeating-radial-gradient(
      circle,
      #111 0px,
      #111 5px,
      #222 5px,
      #222 10px
    );

  /* ✅ glow DJ */
  box-shadow:
    0 0 25px rgba(0,240,255,0.5),
    0 0 80px rgba(255,0,200,0.4);

  animation: spin 24s linear infinite;
}


/* ✅ CENTRE DU VINYLE */
.disc::after {
  content:"";

  width:120px;
  height:120px;

  border-radius:50%;

  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);

  /* ✅ TON IMAGE */
  background: url("test1.jpg");
  background-size: cover;
  background-position: center;

  border: 4px solid #000;

  /* ✅ effet glow */
  box-shadow:
    0 0 10px rgba(0,240,255,0.5),
    0 0 20px rgba(255,0,200,0.4);
}


/* ✅ ANIMATION ROTATION */
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* BOTTOM */
.bottom {
  width:100%;
  max-width:800px;
  margin-bottom:70px;

transform: translateY(-30px); /* ✅ remonte sans agrandir la page */
}

}

.who {
  margin-bottom:20px;
  letter-spacing:2px;
}

.buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
}

.btn {
  background:#d9d6d1;
  border-radius:40px;
  padding:16px 0;
  font-size:20px;
  border:none;
  cursor:pointer;

  transition: transform 0.15s ease, box-shadow 0.15s ease;

  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* ✅ SURVOL = petit agrandissement */
.btn:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

/* ✅ CLIC = effet appui */
.btn:active {
  transform: scale(0.95);
  box-shadow: 0 2px 5px rgba(0,0,0,0.4);
}

.buttons .btn:first-child {
  box-shadow: 0 0 15px rgba(0,240,255,0.6);
}

.buttons .btn:first-child:hover {
  box-shadow: 0 0 30px rgba(0,240,255,1);
}

.buttons .btn:nth-child(2) {
  box-shadow: 0 0 15px rgba(255,0,200,0.6);
}

.buttons .btn:nth-child(2):hover {
  box-shadow: 0 0 30px rgba(255,0,200,1);
}

.btn:hover {
  transform:scale(1.05);
  background:#fff;
}

.credit {
  margin-top: 15px;
  font-size: 13px;
  opacity: 0.6;
}



html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  width: 100%;
touch-action: manipulation;
}


<h1 class="title">QUEUE IT</h1>
<p class="subtitle">Live playlist</p>

/* APP */
.container {
  max-width:600px;
  margin:auto;
  padding:30px;
}

.back {
  background:#fff;
  color:#000;
  font-weight:bold;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

input, select {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

.item {
  
 background: rgba(0,0,0,0.6);
  padding:12px;
  margin-top:10px;
  border-radius:8px;

  transition: transform 0.2s;
}
  backdrop-filter: blur(8px);

  border: 1px solid rgba(255,255,255,0.1);
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.playing {
  border-left: 4px solid cyan;
  box-shadow: 0 0 15px rgba(0,240,255,0.6);
}

}

.delete {
  background:#fff;
  color:#000;
  border:none;
  border-radius:50%;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* ✅ GLOBAL LOCK */
html, body {
  height: 100%;
  overflow: hidden;
  margin: 0;
}

/* ✅ BACKGROUND */
.background {
  height: 100vh;
  width: 100%;

margin: 0;
  overflow: hidden;

  background:
    radial-gradient(circle at 20% 20%, rgba(0,240,255,0.2), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(255,0,200,0.2), transparent 40%),
    linear-gradient(180deg, #2c00c7, #0d003a);

  background-size: 200% 200%;
  background-position: 0% 50%;
  animation: moveBg 8s ease-in-out infinite;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  padding: 15px;
  box-sizing: border-box;

overflow: hidden; /* ✅ empêche débordement interne */
}

/* ✅ ANIMATION FOND */
@keyframes moveBg {
  0% { background-position: 0% 50%; }
  25% { background-position: 50% 100%; }
  50% { background-position: 100% 50%; }
  75% { background-position: 50% 0%; }
  100% { background-position: 0% 50%; }
}

/* ✅ HOVER LISTE */
.delete:hover {
  background:#ff2d78;
  color:white;
}

.item:hover {
  transform: translateX(6px);
  transition:0.2s;
}

/* ✅ MOBILE FIX PERFECT */
@media screen and (max-width: 768px) {

  body {
    font-size: 14px;
  }

  /* ✅ CENTRAGE GLOBAL */
  .background {
    justify-content: center;
    align-items: center;
    padding: 15px;
  }

  /* ✅ CONTENU CENTRÉ */
  .top {
    text-align: center;
    width: 100%;
  }

  .bottom {
    width: 100%;
    max-width: 350px;
    transform: translateY(-15px);
  }

  /* ✅ TITRE */
  .title {
    font-size: clamp(30px, 8vw, 50px);
    padding: 6px 15px;
  }

  /* ✅ SUBTITLE */
  .subtitle {
    font-size: 12px;
    padding: 6px 15px;
    margin-top: 8px;
  }

  /* ✅ DISQUE */
  .disc {
    width: 180px;
    height: 180px;
  }

  .disc::after {
    width: 60px;
    height: 60px;
  }

  /* ✅ ESPACES */
  .top {
    margin-bottom: 10px;
  }

  /* ✅ BOUTONS */
  .buttons {
    gap: 15px;
    width: 100%;
  }

  .btn {
    font-size: 14px;
    padding: 10px 0;
    width: 100%;
  }

  /* ✅ TEXTE */
  .who {
    font-size: 16px;
    margin-bottom: 10px;
  }
}

.container,
.top,
.bottom {
  width: 100%;
  max-width: 500px; /* ✅ limite largeur mobile */
  margin: 0 auto;
}

</style>

</head>

<body>

<!-- HOME -->
<div id="home" class="home">

  <div class="top">
    <h1 class="title">QUEUE IT</h1>
    <p class="subtitle">DROP YOUR TRACK 🎧</p>
  </div>

  <div class="center-visual">
    <div class="disc"></div>
  </div>

<div class="bottom">
  <h2 class="who">WHO ARE YOU ?</h2>

  <div class="buttons">
    <button class="btn" onclick="askCode()">DJ</button>
    <button class="btn" onclick="goUser()">ASKER</button>
  </div>

  <div class="credit">Made by : vico</div>
</div>
 </div>

<!-- APP -->

<div id="app" class="background" style="display:none;">


  <button class="back" onclick="location.reload()">⬅ Retour menu</button>

  <div id="requestSection">
    <h2>Ajouter une musique</h2>

    <input id="song" placeholder="Titre">
    <input id="name" placeholder="Artiste">

    <select id="platform">
      <option value="">Plateforme</option>
      <option>Spotify</option>
      <option>YouTube</option>
      <option>Deezer</option>
      <option>Apple Music</option>
      <option>SoundCloud</option>
    </select>

    <button onclick="add()">Envoyer</button>
  </div>

  <h2>File d'attente</h2>
  <div id="list"></div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAdyyVW-ZTn8O5RjGuq8JZeirY_kOlGxoQ",
  authDomain: "dj-queu.firebaseapp.com",
  databaseURL: "https://dj-queu-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dj-queu"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ref = db.ref("queue");

let queue = [];
let isDJ = false;

/* NAV */
function goUser(){
  isDJ = false;
  document.getElementById('home').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('requestSection').style.display='block';
}

function askCode(){
  const code = prompt("Code DJ ?");
  if(code === "120916"){
    isDJ = true;

    document.getElementById('home').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('requestSection').style.display='none';

    render();
  }
}

/* ADD */
function add(){
  const song = document.getElementById('song').value.trim();
  const name = document.getElementById('name').value || "Anonyme";
  const platform = document.getElementById('platform').value;

  if(!song) return alert("Entre une musique");

  ref.push({ song, name, platform });

  document.getElementById('song').value='';
  document.getElementById('name').value='';
}

/* REMOVE */
function remove(id){
  if(!isDJ) return;
  ref.child(id).remove();
}

/* LIVE */
ref.on("value", snap => {
  const data = snap.val();
  queue = data ? Object.entries(data).map(([id,val]) => ({id,...val})) : [];
  render();
});

/* DRAG */
let draggedIndex = null;

function render(){
  const list = document.getElementById("list");
  list.innerHTML="";

  queue.forEach((item,i)=>{
    const div = document.createElement("div");
    div.className="item "+(i===0?"playing":"");
    div.draggable=isDJ;

    div.innerHTML = `
      <div class="row">
        <div>
          <strong>${i===0?"▶":i+1}</strong> ${item.song}<br>
          <small>${item.name}</small>
        </div>
        ${isDJ ? `<button class="delete" onclick="remove('${item.id}')">✕</button>` : ""}
      </div>
    `;

    if(isDJ){
      div.addEventListener("dragstart", ()=>draggedIndex=i);
      div.addEventListener("dragover", e=>e.preventDefault());
      div.addEventListener("drop", ()=>{
        const moved = queue.splice(draggedIndex,1)[0];
        queue.splice(i,0,moved);

        const updated={};
        queue.forEach(q=>updated[q.id]=q);
        ref.set(updated);
      });
    }

    list.appendChild(div);
  });
}

</script>

</body>
</html>
