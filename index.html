<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Queue</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>

/* GLOBAL */
body {
  margin:0;
  font-family:sans-serif;
  background:#0a0a12;
  color:#fff;
}

/* 🔥 HOME DESIGN */
.home {
  height:100vh;
  width:100%;

  background:
    radial-gradient(circle at 30% 20%, rgba(100,0,255,0.4), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(0,240,255,0.2), transparent 40%),
    linear-gradient(180deg, #2c00c7, #0d003a);

  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  padding:40px 20px;
  position:relative;
}

/* TOP */
.top {
  text-align:center;
}

.title {
  font-size:80px;
  color:#6ff4f0;
  margin:0;
}

.subtitle {
  color:#6ff4f0;
  font-size:20px;
  margin-top:10px;
}

/* CENTER DISC */
.center-visual {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.disc {
  width:160px;
  height:160px;
  border-radius:50%;
  background: radial-gradient(circle, #222 20%, #000 60%);
  box-shadow:
    0 0 20px rgba(0,240,255,0.4),
    0 0 60px rgba(255,0,200,0.3);
  animation:spin 6s linear infinite;
}

.disc::after {
  content:"";
  width:20px;
  height:20px;
  background:#999;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
}

@keyframes spin {
  from { transform:rotate(0deg); }
  to { transform:rotate(360deg); }
}

/* BOTTOM */
.bottom {
  width:100%;
  max-width:800px;
  margin-bottom:40px;
}

.who {
  margin-bottom:20px;
  letter-spacing:2px;
}

.buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
}

.btn {
  background:#d9d6d1;
  border-radius:50px;
  padding:16px 0;
  font-size:20px;
  border:none;
  cursor:pointer;
  transition:0.2s;
}

.btn:hover {
  transform:scale(1.05);
  background:#fff;
}

.credit {
  position:absolute;
  bottom:20px;
  right:25px;
  font-weight:bold;
}

/* APP */
.container {
  max-width:600px;
  margin:auto;
  padding:30px;
}

.back {
  background:#fff;
  color:#000;
  font-weight:bold;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

input, select {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

.item {
  background:#111;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.playing {
  border-left:4px solid cyan;
}

.delete {
  background:#fff;
  color:#000;
  border:none;
  border-radius:50%;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="home">

  <div class="top">
    <h1 class="title">DJ QUEUE</h1>
    <p class="subtitle">Propose your song !</p>
  </div>

  <div class="center-visual">
    <div class="disc"></div>
  </div>

  <div class="bottom">
    <h2 class="who">WHO ARE YOU ?</h2>

    <div class="buttons">
      <button class="btn" onclick="askCode()">DJ</button>
      <button class="btn" onclick="goUser()">ASKER</button>
    </div>
  </div>

  <div class="credit">Made by : vico</div>

</div>

<!-- APP -->
<div id="app" class="container" style="display:none;">

  <button class="back" onclick="location.reload()">⬅ Retour menu</button>

  <div id="requestSection">
    <h2>Ajouter une musique</h2>

    <input id="song" placeholder="Titre / artiste">
    <input id="name" placeholder="Ton prénom">

    <select id="platform">
      <option value="">Plateforme</option>
      <option>Spotify</option>
      <option>YouTube</option>
      <option>Deezer</option>
      <option>Apple Music</option>
      <option>SoundCloud</option>
    </select>

    <button onclick="add()">Envoyer</button>
  </div>

  <h2>File d'attente</h2>
  <div id="list"></div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAdyyVW-ZTn8O5RjGuq8JZeirY_kOlGxoQ",
  authDomain: "dj-queu.firebaseapp.com",
  databaseURL: "https://dj-queu-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dj-queu"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ref = db.ref("queue");

let queue = [];
let isDJ = false;

/* NAV */
function goUser(){
  isDJ = false;
  document.getElementById('home').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('requestSection').style.display='block';
}

function askCode(){
  const code = prompt("Code DJ ?");
  if(code === "120916"){
    isDJ = true;

    document.getElementById('home').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('requestSection').style.display='none';

    render();
  }
}

/* ADD */
function add(){
  const song = document.getElementById('song').value.trim();
  const name = document.getElementById('name').value || "Anonyme";
  const platform = document.getElementById('platform').value;

  if(!song) return alert("Entre une musique");

  ref.push({ song, name, platform });

  document.getElementById('song').value='';
  document.getElementById('name').value='';
}

/* REMOVE */
function remove(id){
  if(!isDJ) return;
  ref.child(id).remove();
}

/* LIVE */
ref.on("value", snap => {
  const data = snap.val();
  queue = data ? Object.entries(data).map(([id,val]) => ({id,...val})) : [];
  render();
});

/* DRAG */
let draggedIndex = null;

function render(){
  const list = document.getElementById("list");
  list.innerHTML="";

  queue.forEach((item,i)=>{
    const div = document.createElement("div");
    div.className="item "+(i===0?"playing":"");
    div.draggable=isDJ;

    div.innerHTML = `
      <div class="row">
        <div>
          <strong>${i===0?"▶":i+1}</strong> ${item.song}<br>
          <small>${item.name}</small>
        </div>
        ${isDJ ? `<button class="delete" onclick="remove('${item.id}')">✕</button>` : ""}
      </div>
    `;

    if(isDJ){
      div.addEventListener("dragstart", ()=>draggedIndex=i);
      div.addEventListener("dragover", e=>e.preventDefault());
      div.addEventListener("drop", ()=>{
        const moved = queue.splice(draggedIndex,1)[0];
        queue.splice(i,0,moved);

        const updated={};
        queue.forEach(q=>updated[q.id]=q);
        ref.set(updated);
      });
    }

    list.appendChild(div);
  });
}

</script>

</body>
</html>
