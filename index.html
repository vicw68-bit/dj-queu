/* 🔥 DISQUE SPIRALE */
.disc {
  width:380px;
  height:380px;
  border-radius:50%;
  position: relative;

  /* ✅ spirale + lignes propres */
  background:
    repeating-conic-gradient(

      transparent 48deg

    repeating-radial-gradient(
      circle,
      #111 0px,
      #111 5px,
      #222 5px,
      #222 10px
    );

  /* ✅ glow DJ */
  box-shadow:
    0 0 25px rgba(0,240,255,0.5),
    0 0 80px rgba(255,0,200,0.4);

  animation: spin 24s linear infinite;
}


/* ✅ CENTRE DU VINYLE */
.disc::after {
  content:"";

  width:120px;
  height:120px;

  border-radius:50%;

  position:absolute;
  top:50%;
  left:50%;

}

.play {

/* ✅ cercle parfaitement autour */
.play::after {

 <button onclick="resetApp()">⬅ Retour menu</button>

<script>

function goRoomMenu(){

function submitRoom(){

  const name = document.getElementById("roomNameInput").value.trim();
  const codeInput = document.getElementById("roomCodeInput").value.trim();

  if(mode === "create"){

    if(!name){
      alert("Entre un nom");
      return;
    }

    const code = generateCode();

    db.ref("rooms/" + code).set({
      name: name,
      queue: {}
    });

    alert("✅ Room créée ! Code : " + code);

    localStorage.setItem("room", code);
    location.reload();
  }

  else if(mode === "join"){

    if(!codeInput){
      alert("Entre un code");
      return;
    }

    db.ref("rooms/" + codeInput).once("value", snap => {
      if(snap.exists()){
        localStorage.setItem("room", codeInput);
localStorage.removeItem("isDJ");
        location.reload();
      } else {
        alert("Room introuvable ❌");
      }
    });
  }
}

 
function boost(id){

  // bloque double vote
  if(localStorage.getItem("voted_" + id)) return;

  const itemRef = ref.child(id);

  itemRef.once("value", snap => {
    const data = snap.val();

    if(!data) return;

    const newVotes = (data.votes || 0) + 1;

    // ✅ update seulement les votes
    itemRef.update({
      votes: newVotes
    });
  });

  // ✅ bloquer vote utilisateur
  localStorage.setItem("voted_" + id, "true");
}

function resetApp(){

}

localStorage.removeItem("isDJ");

function generateCode(){
  return Math.floor(100000 + Math.random() * 900000).toString();
}

});

function goChoice(){
  document.getElementById("home").style.display = "none";

 localStorage.removeItem("isDJ");

function loadRooms(){

  const container = document.getElementById("roomList");
  if(!container){
    console.log("❌ container introuvable");
    return;
  }

  db.ref("rooms").once("value").then(snap => {

    const data = snap.val();
    console.log("🔥 ROOMS DATA:", data);

    // ✅ appel direct obligatoire
    showRooms(data);

  }).catch(err => {
    console.error("❌ Firebase error:", err);
  });

}



function showRooms(data){

  const container = document.getElementById("roomList");
  container.innerHTML = "";

  if(!data){
    container.innerHTML = "<p>Aucune room</p>";
    return;
  }

  Object.keys(data).forEach(code => {

    const roomData = data[code];

    // ✅ on affiche TOUT ce qui est dans rooms
    // même si c'est vide
    if(typeof roomData !== "object") return;

    const name = (roomData && roomData.name)
      ? roomData.name
      : "Room " + code;

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div onclick="selectRoom('${code}')" style="flex:1; cursor:pointer;">
          <strong>${name}</strong><br>
          <small>Code : ${code}</small>
        </div>
        <button onclick="deleteRoom(event,'${code}')" class="delete">✕</button>
      </div>
    `;

    container.appendChild(div);
  });
}


function selectRoom(code){
  localStorage.setItem("room", code);
    localStorage.setItem("isDJ", "true")
  location.reload();
}

function deleteRoom(event, code){
  event.stopPropagation(); // ✅ empêche de rejoindre la room

  if(!confirm("Supprimer cette room ?")) return;

  db.ref("rooms/" + code).remove();
  
  // refresh liste
  loadRooms();
}

let currentAudio = null;
let currentUrl = null;
let currentButton = null;

function playPreview(url, button) {
  if(!url) return;

  // pause si même musique
  if(currentAudio && currentUrl === url){
    currentAudio.pause();
    currentAudio = null;
    currentUrl = null;

    if(currentButton) currentButton.classList.remove("playing");

    return;
  }

  // stop ancien
  if(currentAudio){
    currentAudio.pause();
    if(currentButton) currentButton.classList.remove("playing");
  }

  // play
  currentAudio = new Audio(url);
  currentAudio.play();

  currentUrl = url;
  currentButton = button;

  button.classList.add("playing");
}


const songInput = document.getElementById("song");
const artistInput = document.getElementById("name");
const resultsDiv = document.getElementById("results");

let timeout = null;

/* ✅ écouter les deux champs */
[songInput, artistInput].forEach(input => {
  input.addEventListener("input", () => {
    clearTimeout(timeout);

    const song = songInput.value.trim();
    const artist = artistInput.value.trim();

    const query = (song + " " + artist).trim();

    if(query.length < 2){
      resultsDiv.innerHTML = "";
      return;
    }

    timeout = setTimeout(() => {
      searchDeezer(query);
    }, 300);
  });
});

/* ✅ JSONP */
function searchDeezer(query){

  const script = document.createElement("script");

  script.src = "https://api.deezer.com/search?q=" 
    + encodeURIComponent(query) 
    + "&output=jsonp&callback=displayResults";

  document.body.appendChild(script);
}

/* ✅ CALLBACK */
function displayResults(data){

  resultsDiv.innerHTML = "";

  if(!data.data) return;

  data.data.slice(0,5).forEach(track => {

  const div = document.createElement("div");
  div.className = "result"; // ✅ simple

  div.innerHTML = `
    <img src="${track.album.cover_small}">
    <div>${track.artist.name} - ${track.title}</div>
  `;

  div.onclick = () => {
    songInput.value = track.title;
    artistInput.value = track.artist.name;

    songInput.dataset.link = track.link;
    songInput.dataset.cover = track.album.cover_medium;
songInput.dataset.preview = track.preview;

    resultsDiv.innerHTML = "";
  };

  resultsDiv.appendChild(div);
});
}


/* ADD */

function add(){
  const song = document.getElementById("song").value.trim();
  const name = document.getElementById("name").value || "Anonyme";
  const platform = document.getElementById("platform").value;
const preview = songInput.dataset.preview || "";
  const link = songInput.dataset.link || "";
  const cover = songInput.dataset.cover || "";
 

  if(!song) return alert("Entre une musique");

ref.push({
  song,
  name,
  platform,
  link,
  cover,
preview,
  votes: 0   // ✅
});

  /* reset */
  document.getElementById("song").value = "";
  document.getElementById("name").value = "";

  delete songInput.dataset.link;
  delete songInput.dataset.cover;

  /* ✅ FEEDBACK */
  showFeedback("Track added ✅");

document.addEventListener("click", (e) => {
  if(!e.target.closest("#song") && !e.target.closest("#results")){
    resultsDiv.innerHTML = "";
  }
});
}


/* REMOVE */
function remove(id){
  if(!isDJ) return;
  ref.child(id).remove();
}

/* LIVE */

function showFeedback(text){
  const msg = document.createElement("div");
  msg.className = "feedback";
  msg.innerText = text;

  document.body.appendChild(msg);

  setTimeout(()=>{
    msg.remove();
  }, 2000);
}

/* DRAG */
let draggedIndex = null;



function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  const sortedQueue = [...queue].sort((a, b) => (b.votes || 0) - (a.votes || 0));

  const nowPlayingDiv = document.getElementById("nowPlaying");

  if(sortedQueue.length > 0){
    const top = sortedQueue[0];

    nowPlayingDiv.innerHTML = `
      <strong>▶ ${top.song}</strong><br>
      <small>${top.name}</small>
    `;
  } else {
    nowPlayingDiv.innerHTML = "";
  }

  sortedQueue.forEach((item,i)=>{
    const div = document.createElement("div");

    div.className = "item " + (i===0 ? "playing" : "");
    div.draggable = isDJ;

    const alreadyVoted = localStorage.getItem("voted_" + item.id);

    div.innerHTML = `
      <div class="row">
        <div class="left">
          <strong>${i===0 ? "▶" : i+1}</strong> ${item.song}<br>
          <small>${item.name}</small>
        </div>

        <div class="right">
<button class="play" onclick="playPreview('${item.preview}', this)">▶️</button>
          <button class="fire ${alreadyVoted ? "active" : ""}"
                  onclick="boost('${item.id}')">🔥</button>

          <span class="votes">${item.votes || 0}</span>

          ${
            isDJ
              ? `<button class="delete" onclick="remove('${item.id}')">✕</button>`
              : ""
          }
        </div>
      </div>
    `;

    list.appendChild(div);


    /* DRAG */
    if(isDJ){
      div.addEventListener("dragstart", () => draggedIndex = i);
      div.addEventListener("dragover", e => e.preventDefault());
      div.addEventListener("drop", ()=>{
        const moved = queue.splice(draggedIndex,1)[0];
        queue.splice(i,0,moved);

        const updated = {};
        queue.forEach(q => updated[q.id] = q);
        ref.set(updated);
      });
    }

    list.appendChild(div);
  });
}

let enteredCode = "";

function askCode(){
  document.getElementById("choice").style.display = "none";
  document.getElementById("djCodeScreen").style.display = "flex";
}

function addDigit(d){
  if(enteredCode.length >= 6) return;

  enteredCode += d;
  updateDisplay();
}

function clearCode(){
  enteredCode = enteredCode.slice(0, -1);
  updateDisplay();
}

function updateDisplay(){
  const display = document.getElementById("codeDisplay");

  display.innerText =
  enteredCode.split("").map(() => "•").join(" ")
  + " " +
  "• ".repeat(6 - enteredCode.length);
}

function validateCode(){
  if(enteredCode === "120916"){
    localStorage.setItem("isDJ", "true");
    location.reload();
  } else {
    alert("Code incorrect ❌");
    enteredCode = "";
    updateDisplay();
  }
}

function backToChoice(){
  enteredCode = "";

  document.getElementById("djCodeScreen").style.display = "none";
  document.getElementById("choice").style.display = "flex";
}
