<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Queue</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
body { background:#0a0a12; color:#fff; font-family:sans-serif; margin:0 }
.container { max-width:600px; margin:auto; padding:30px }

button { padding:12px; width:100%; margin-top:10px; border:none; border-radius:8px; cursor:pointer }
.main { background:linear-gradient(135deg,#ff2d78,#bf00ff); color:#fff }
.dj { background:linear-gradient(135deg,#00f0ff,#bf00ff) }
.back { background:#222 }

input, select { width:100%; padding:10px; margin-top:10px; border-radius:8px; border:none }

.item {
  background:#111;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.playing { border-left:4px solid cyan }

.delete {
  background:red;
  border:none;
  color:#fff;
  border-radius:50%;
  width:30px;
  height:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="container">
  <h1>🎧 DJ QUEUE</h1>
  <button class="main" onclick="goUser()">Faire une demande</button>
  <button class="dj" onclick="askCode()">Accès DJ</button>
</div>

<!-- APP -->
<div id="app" class="container" style="display:none;">

  <!-- ✅ BOUTON RETOUR -->
  <button class="back" onclick="goHome()">⬅ Retour menu</button>

  <h2>Ajouter une musique</h2>

  <input id="song" placeholder="Titre / artiste">
  <input id="name" placeholder="Ton prénom">

  <!-- ✅ MENU DEROUlant -->
  <select id="platform">
    <option value="">Plateforme (optionnel)</option>

    <optgroup label="Streaming global">
      <option>Spotify</option>
      <option>YouTube</option>
      <option>YouTube Music</option>
      <option>Deezer</option>
      <option>Apple Music</option>
      <option>Amazon Music</option>
      <option>Tidal</option>
      <option>Qobuz</option>
    </optgroup>

    <optgroup label="Europe / spécialisés">
      <option>SoundCloud</option>
      <option>Mixcloud</option>
      <option>Bandcamp</option>
      <option>Beatport</option>
      <option>Napster</option>
      <option>Audiomack</option>
    </optgroup>

    <optgroup label="Autre">
      <option>Autre</option>
    </optgroup>
  </select>

  <button class="main" onclick="add()">Envoyer</button>

  <h2>File d'attente</h2>
  <div id="list"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAdyyVW-ZTn8O5RjGuq8JZeirY_kOlGxoQ",
  authDomain: "dj-queu.firebaseapp.com",
  databaseURL: "https://dj-queu-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dj-queu"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ref = db.ref("queue");

let queue = [];
let isDJ = false;

/* NAV */
function goUser(){
  document.getElementById('home').style.display='none';
  document.getElementById('app').style.display='block';
}

function goHome(){
  document.getElementById('app').style.display='none';
  document.getElementById('home').style.display='block';
}

function askCode(){
  const code = prompt("Code DJ ?");
  if(code === "120916"){
    isDJ = true;
    goUser();
  } else {
    alert("Code incorrect");
  }
}

/* ADD */
function add(){
  const song = document.getElementById('song').value.trim();
  const name = document.getElementById('name').value.trim() || "Anonyme";
  const platform = document.getElementById('platform').value;

  if(!song) return alert("Entre une musique");

  ref.push({
    song,
    name,
    platform,
    time: Date.now()
  });

  document.getElementById('song').value='';
  document.getElementById('name').value='';
  document.getElementById('platform').value='';
}

/* DELETE DJ */
function remove(id){
  if(!isDJ) return;
  ref.child(id).remove();
}

/* LIVE */
ref.on("value", snapshot => {
  const data = snapshot.val();
  queue = data ? Object.entries(data).map(([id,val]) => ({id,...val})) : [];
  render();
});

/* RENDER */
function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  queue.forEach((item,i)=>{
    const div = document.createElement("div");
    div.className = "item " + (i === 0 ? "playing" : "");

    div.innerHTML = `
      <div>
        <strong>${i===0 ? "▶" : i+1}</strong> ${item.song}<br>
        <small>${item.name}${item.platform ? " • " + item.platform : ""}</small>
      </div>
      ${isDJ ? `<button class="delete" onclick="remove('${item.id}')">✕</button>` : ""}
    `;

    list.appendChild(div);
  });
}
</script>

</body>
</html>
