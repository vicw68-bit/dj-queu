<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Queue</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
body { background:#0a0a12; color:#fff; font-family:sans-serif; margin:0 }
.container { max-width:600px; margin:auto; padding:30px }

button {
  padding:12px;
  width:100%;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.main { background:linear-gradient(135deg,#ff2d78,#bf00ff); color:#fff }
.dj { background:linear-gradient(135deg,#00f0ff,#bf00ff) }

.back {
  background:#fff;
  color:#000;
  font-weight:bold;
}

input, select {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

.item {
  background:#111;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  cursor:grab;
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.playing { border-left:4px solid cyan }

.delete {
  background:#fff;
  color:#000;
  border-radius:50%;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  cursor:pointer;
  border:none;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="container">
  <h1>🎧 DJ QUEUE</h1>
  <button class="main" onclick="goUser()">Faire une demande</button>
  <button class="dj" onclick="askCode()">Accès DJ</button>
</div>

<!-- APP -->
<div id="app" class="container" style="display:none;">

  <button class="back" onclick="goHome()">⬅ Retour menu</button>

  <!-- DEMANDEUR -->
  <div id="requestSection">
    <h2>Ajouter une musique</h2>

    <input id="song" placeholder="Titre / artiste">
    <input id="name" placeholder="Ton prénom">

    <select id="platform">
      <option value="">Plateforme</option>
      <option>Spotify</option>
      <option>YouTube</option>
      <option>Deezer</option>
      <option>Apple Music</option>
      <option>SoundCloud</option>
    </select>

    <button class="main" onclick="add()">Envoyer</button>
  </div>

  <h2>File d'attente</h2>
  <div id="list"></div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAdyyVW-ZTn8O5RjGuq8JZeirY_kOlGxoQ",
  authDomain: "dj-queu.firebaseapp.com",
  databaseURL: "https://dj-queu-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dj-queu"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ref = db.ref("queue");

let queue = [];
let isDJ = false;

/* NAV */
function goUser(){
  isDJ = false;
  document.getElementById('home').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('requestSection').style.display='block';
}

function goHome(){
  document.getElementById('app').style.display='none';
  document.getElementById('home').style.display='block';
}

function askCode(){
  const code = prompt("Code DJ ?");
  if(code === "120916"){
    isDJ = true;

    document.getElementById('home').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('requestSection').style.display='none';

    render();
  } else {
    alert("Code incorrect");
  }
}

/* AJOUT */
function add(){
  const song = document.getElementById('song').value.trim();
  const name = document.getElementById('name').value.trim() || "Anonyme";
  const platform = document.getElementById('platform').value;

  if(!song) return alert("Entre une musique");

  ref.push({
    song,
    name,
    platform
  });

  document.getElementById('song').value='';
  document.getElementById('name').value='';
  document.getElementById('platform').value='';
}

/* SUPPRESSION */
function remove(id){
  if(!isDJ) return;
  ref.child(id).remove();
}

/* LIVE */
ref.on("value", snapshot => {
  const data = snapshot.val();

  queue = data
    ? Object.entries(data).map(([id,val]) => ({id,...val}))
    : [];

  render();
});

/* DRAG & DROP */
let draggedIndex = null;

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  queue.forEach((item,i)=>{
    const div = document.createElement("div");
    div.className = "item " + (i===0 ? "playing" : "");
    div.draggable = isDJ;

    div.innerHTML = `
      <div class="row">
        <div>
          <strong>${i===0 ? "▶" : i+1}</strong> ${item.song}<br>
          <small>${item.name}${item.platform ? " • "+item.platform : ""}</small>
        </div>
        ${isDJ ? `<button class="delete" onclick="remove('${item.id}')">✕</button>` : ""}
      </div>
    `;

    if(isDJ){
      div.addEventListener("dragstart", () => draggedIndex = i);
      div.addEventListener("dragover", e => e.preventDefault());
      div.addEventListener("drop", () => {
        const moved = queue.splice(draggedIndex,1)[0];
        queue.splice(i,0,moved);

        const newData = {};
        queue.forEach(q => newData[q.id] = q);
        ref.set(newData);
      });
    }

    list.appendChild(div);
  });
}
</script>

</body>
</html>
