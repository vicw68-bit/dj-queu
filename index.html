<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Queue</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>

/* GLOBAL */
body {
  margin:0;
  font-family:sans-serif;
  background:#0a0a12;
  color:#fff;
}

/* ========= HOME DESIGN (CANVA STYLE) ========= */

.home {
  height:100vh;
  background:linear-gradient(180deg,#2c00c7,#1a0080);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  padding:40px 20px;
  box-sizing:border-box;
  position:relative;
}

/* TOP */
.top {
  text-align:center;
}

.title {
  font-size:80px;
  color:#6ff4f0;
  margin:0;
}

.subtitle {
  color:#6ff4f0;
  font-size:22px;
  margin-top:10px;
}

/* MIDDLE */
.middle {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.who {
  font-size:28px;
  letter-spacing:2px;
}

/* BUTTONS */
.buttons {
  width:100%;
  max-width:900px;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:80px;

  padding:0 40px;
}

.btn {
  background:#d9d6d1;
  border:none;
  border-radius:50px;

  padding:18px 0;

  font-size:22px;
  cursor:pointer;

  transition:0.2s;
}

.btn:hover {
  transform:scale(1.05);
  background:#fff;
}

/* CREDIT */
.credit {
  position:absolute;
  bottom:20px;
  right:30px;
  font-weight:bold;
}

/* ========= APP ========= */

.container {
  max-width:600px;
  margin:auto;
  padding:30px;
}

.main {
  background:linear-gradient(135deg,#ff2d78,#bf00ff);
  color:#fff;
}

.dj {
  background:linear-gradient(135deg,#00f0ff,#bf00ff);
}

.back {
  background:#fff;
  color:#000;
  font-weight:bold;
}

/* INPUT */
input, select {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

/* LIST */
.item {
  background:#111;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.playing {
  border-left:4px solid cyan;
}

/* DELETE */
.delete {
  background:#fff;
  color:#000;
  border:none;
  border-radius:50%;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="home">

  <div class="top">
    <h1 class="title">DJ QUEUE</h1>
    <p class="subtitle">Propose your song !</p>
  </div>

  <div class="middle">
    <h2 class="who">WHO ARE YOU ?</h2>
  </div>

  <div class="buttons">
    <button class="btn" onclick="askCode()">DJ</button>
    <button class="btn" onclick="goUser()">ASKER</button>
  </div>

  <div class="credit">Made by : vico</div>
</div>

<!-- APP -->
<div id="app" class="container" style="display:none;">

  <button class="back" onclick="goHome()">⬅ Retour menu</button>

  <!-- DEMANDE -->
  <div id="requestSection">
    <h2>Ajouter une musique</h2>

    <input id="song" placeholder="Titre / artiste">
    <input id="name" placeholder="Ton prénom">

    <select id="platform">
      <option value="">Plateforme</option>
      <option>Spotify</option>
      <option>YouTube</option>
      <option>Deezer</option>
      <option>Apple Music</option>
      <option>SoundCloud</option>
    </select>

    <button class="main" onclick="add()">Envoyer</button>
  </div>

  <h2>File d'attente</h2>
  <div id="list"></div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAdyyVW-ZTn8O5RjGuq8JZeirY_kOlGxoQ",
  authDomain: "dj-queu.firebaseapp.com",
  databaseURL: "https://dj-queu-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dj-queu"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ref = db.ref("queue");

/* STATE */
let queue = [];
let isDJ = false;

/* NAV */
function goUser(){
  isDJ = false;
  document.getElementById('home').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('requestSection').style.display='block';
}


function goHome(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('home').style.display = 'flex';

  // ✅ force recalcul du layout
  setTimeout(() => {
    document.querySelector('.home').style.display = "none";
    void document.querySelector('.home').offsetHeight; // force refresh
    document.querySelector('.home').style.display = "flex";
  }, 10);
}

function askCode(){
  const code = prompt("Code DJ ?");
  if(code === "120916"){
    isDJ = true;

    document.getElementById('home').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('requestSection').style.display='none';

    render();
  } else {
    alert("Code incorrect");
  }
}

/* ADD */
function add(){
  const song = document.getElementById('song').value.trim();
  const name = document.getElementById('name').value.trim() || "Anonyme";
  const platform = document.getElementById('platform').value;

  if(!song) return alert("Entre une musique");

  ref.push({ song, name, platform });

  document.getElementById('song').value='';
  document.getElementById('name').value='';
  document.getElementById('platform').value='';
}

/* REMOVE */
function remove(id){
  if(!isDJ) return;
  ref.child(id).remove();
}

/* REALTIME */
ref.on("value", snapshot => {
  const data = snapshot.val();

  queue = data
    ? Object.entries(data).map(([id,val]) => ({id,...val}))
    : [];

  render();
});

/* DRAG */
let draggedIndex = null;

/* RENDER */
function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  queue.forEach((item,i) => {

    const div = document.createElement("div");
    div.className = "item " + (i===0 ? "playing": "");
    div.draggable = isDJ;

    div.innerHTML = `
      <div class="row">
        <div>
          <strong>${i===0 ? "▶" : i+1}</strong> ${item.song}<br>
          <small>${item.name}${item.platform ? " • "+item.platform : ""}</small>
        </div>
        ${isDJ ? `<button class="delete" onclick="remove('${item.id}')">✕</button>` : ""}
      </div>
    `;

    if(isDJ){
      div.addEventListener("dragstart", () => draggedIndex = i);
      div.addEventListener("dragover", e => e.preventDefault());
      div.addEventListener("drop", () => {
        const move = queue.splice(draggedIndex,1)[0];
        queue.splice(i,0,move);

        const updated = {};
        queue.forEach(q => updated[q.id] = q);
        ref.set(updated);
      });
    }

    list.appendChild(div);
  });
}

</script>

</body>
</html>
